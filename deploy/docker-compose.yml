# Pliego en el VPS. Se usa desde esta carpeta:
#   cd /opt/pliego/deploy && docker compose up -d --build
# HTTPS lo da el Traefik que ya existe en el VPS (red root_default), igual que publishing-ai.
name: pliego

services:
  web:
    build: ..
    restart: always
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.pliego.rule=Host(`${APP_DOMAIN:?Falta APP_DOMAIN en deploy/.env}`)
      - traefik.http.routers.pliego.entrypoints=websecure
      - traefik.http.routers.pliego.tls=true
      - traefik.http.routers.pliego.tls.certresolver=mytlschallenge
      - traefik.http.services.pliego.loadbalancer.server.port=8080

networks:
  proxy:
    name: root_default
    external: true
